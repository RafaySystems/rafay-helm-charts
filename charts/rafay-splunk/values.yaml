# Default values for rafay splunk audit log integration.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

config:
  ## Rafay console URL (event/audit APIs)
  url: https://console.rafay.dev
  ## Ops console base URL for partner org listing (GET /v1/auth/organizations/). Defaults to url if empty.
  ops_console_url: ""
  ## Rafay API Key — required in single-tenant mode; optional when partner_api_key is set
  rafay_api_key: ""
  ## Rafay API Secret — optional; accepted for backward compatibility
  rafay_api_secret: ""
  ## Partner API key (optional). When set, lists organizations via GET /v1/auth/organizations/
  ## and ships auditlog / relayaudit / relaycommands per org with X-ORGANIZATION-ID.
  partner_api_key: ""
  ## If true, load PARTNER_API_KEY from the same secret (key partnerkey) without embedding the key in this chart.
  partner_api_key_from_secret: false
  ## Send Initial logs based on following value. Default to "14d" days
  filter: 14d
  ## Time Interval to send logs
  interval: 1m
  ## Set to False to skip TLS certificate verification on Rafay Console API calls
  rafay_ssl_verify: True
  ## Splunk Server Host
  host: splunkserver.mycompany.com
  ## Splunk Server Port
  port: 8088
  ## Splunk HEC Token
  splunk_token: SPLUNK_TOKEN
  ## Set to False for insecure splunk server
  ssl_verify: True
  ## Index name to store audit logs to
  index: k8s-cluster-audit
  ## Existing Secret Name or leave it empty
  secret_name: ""
image:
  repository: registry.rafay-edge.net/rafay-logs/rafay-splunk
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 5.0.0
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:
rbac:
  create: true
replicaCount: 1
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
deploymentAnnotations: {}
podAnnotations: {}
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
