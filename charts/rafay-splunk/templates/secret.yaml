{{- if eq .Values.config.secret_name "" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "rafay-splunk.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.rafay_api_key }}
  rafaykey: {{ .Values.config.rafay_api_key | b64enc }}
  {{- end }}
  {{- if .Values.config.rafay_api_secret }}
  rafaysecret: {{ .Values.config.rafay_api_secret | b64enc }}
  {{- end }}
  {{- if .Values.config.partner_api_key }}
  partnerkey: {{ .Values.config.partner_api_key | b64enc }}
  {{- end }}
  token: {{ .Values.config.splunk_token | b64enc }}
{{- end -}}
