{{- if eq .Values.config.secret_name "" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "rafay-azure-sentinel.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.config.rafay_api_key }}
  rafaykey: {{ .Values.config.rafay_api_key | b64enc }}
  {{- end }}
  {{- if .Values.config.rafay_api_secret }}
  rafaysecret: {{ .Values.config.rafay_api_secret | b64enc }}
  {{- end }}
  {{- if .Values.config.azure_tenant_id }}
  azuretenantid: {{ .Values.config.azure_tenant_id | b64enc }}
  {{- end }}
  {{- if .Values.config.azure_client_id }}
  azureclientid: {{ .Values.config.azure_client_id | b64enc }}
  {{- end }}
  {{- if .Values.config.azure_client_secret }}
  azureclientsecret: {{ .Values.config.azure_client_secret | b64enc }}
  {{- end }}
{{- end -}}
